name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-suite:
    name: Source suite (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install source and test dependencies
        run: python -m pip install --upgrade pip ".[anthropic,keyring,dev]"
      - name: Check generated test catalogue
        run: python -B -m tests.catalogue --check
      - name: Check generated directive catalogue
        run: python -B -m tests.directive_catalogue --check
      - name: Check generated audit event catalogue
        run: python -B -m tests.audit_catalogue --check
      - name: Run source suite
        run: python -B -m pytest -p no:cacheprovider -m "not distribution"

  distribution-gate:
    name: Isolated distribution gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install release dependencies
        run: python -m pip install --upgrade pip ".[dev]" build twine
      # Decide once what this run is evidence for. The retained artifact's name
      # and the record's publication_candidate field are two readers of that one
      # fact, and computing them separately is how they come to disagree. This
      # gate runs on every push and on pull requests, so most runs are for a
      # branch or a refs/pull/N/merge commit that will never be published --
      # correct to verify, wrong to file under the same name as a release.
      - name: Classify the source ref
        id: candidate
        env:
          SOURCE_REF: ${{ github.ref }}
        run: |
          case "$SOURCE_REF" in
            refs/heads/main|refs/tags/*)
              echo "flag=--publication-candidate" >> "$GITHUB_OUTPUT"
              echo "label=publication-candidate" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "flag=" >> "$GITHUB_OUTPUT"
              echo "label=verification-only" >> "$GITHUB_OUTPUT"
              ;;
          esac
      - name: Build and verify the commit-bound candidate
        env:
          SOURCE_REF: ${{ github.ref }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: >-
          python -B release_evidence.py
          --expected-commit "$EXPECTED_COMMIT"
          --source-ref "$SOURCE_REF"
          ${{ steps.candidate.outputs.flag }}
          --output-dir dist
      - name: Retain the verified candidate and its evidence record
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.candidate.outputs.label }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
