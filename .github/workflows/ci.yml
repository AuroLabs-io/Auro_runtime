name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-suite:
    name: Source suite (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install source and test dependencies
        run: python -m pip install --upgrade pip ".[dev]"
      - name: Check generated test catalogue
        run: python -B -m tests.catalogue --check
      - name: Check generated directive catalogue
        run: python -B -m tests.directive_catalogue --check
      - name: Check generated audit event catalogue
        run: python -B -m tests.audit_catalogue --check
      - name: Run source suite
        run: python -B -m pytest -p no:cacheprovider -m "not distribution"

  distribution-gate:
    name: Isolated distribution gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install release dependencies
        run: python -m pip install --upgrade pip ".[dev]" build twine
      - name: Run mandatory isolated-wheel matrix
        env:
          AURO_RUN_DISTRIBUTION_TESTS: "1"
        run: >-
          python -B -m pytest
          tests/test_distribution_install.py
          -m distribution
          -p no:cacheprovider
      - name: Build wheel and source distribution
        run: python -B -m build
      - name: Validate distribution metadata
        run: python -B -m twine check dist/*
