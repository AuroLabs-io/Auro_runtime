name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-suite:
    name: Source suite (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install source and test dependencies
        run: python -m pip install --upgrade pip ".[dev]"
      - name: Check generated test catalogue
        run: python -B -m tests.catalogue --check
      - name: Check generated directive catalogue
        run: python -B -m tests.directive_catalogue --check
      - name: Check generated audit event catalogue
        run: python -B -m tests.audit_catalogue --check
      - name: Run source suite
        run: python -B -m pytest -p no:cacheprovider -m "not distribution"

  distribution-gate:
    name: Isolated distribution gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install release dependencies
        run: python -m pip install --upgrade pip ".[dev]" build twine
      - name: Build and verify the commit-bound publication candidate
        run: >-
          python -B release_evidence.py
          --expected-commit "${{ github.sha }}"
          --output-dir dist
      - name: Retain the verified candidate and its evidence record
        uses: actions/upload-artifact@v4
        with:
          name: publication-candidate-${{ github.sha }}
          path: dist/
          if-no-files-found: error
