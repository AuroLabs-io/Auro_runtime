# Enforce use of the credential proxy for keys, passwords, and tokens.
id: credential_proxy
rules:
  - id: no_hardcoded_secrets
    description: Never hardcode API keys, passwords, or authentication tokens in directives, tool arguments, or prompts. Any credential must be referenced by alias via the credential proxy (e.g. resolve_secret or a tool that accepts credential_alias).
    guard: check_no_raw_credentials
    enforcement: block
    on_error: fail_closed
    tools: [http_request]
  - id: direct_user_to_proxy
    description: If a directive or workflow requires API keys, passwords, or tokens, instruct the user to set them up using the credential proxy (setup_credentials directive) and reference only the alias in the script, never the raw secret.
